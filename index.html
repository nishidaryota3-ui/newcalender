<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Calendar - GitHub版</title>
  <style>
    /* 画面全体（黄なり） */
    body {
      background-color: #f5f3eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: "Shippori Mincho", serif, sans-serif;
      overflow: hidden;
    }

    /* カレンダー枠 */
    .calendar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      cursor: grab;
    }
    .calendar-container:active { cursor: grabbing; }
    
    /* 読み込んだSVGを画面にフィットさせる */
    .calendar-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* インスペクター（入力パネル） */
    #inspector {
      position: fixed;
      top: 0;
      right: -400px;
      width: 360px;
      height: 100vh;
      background: rgba(25, 30, 40, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: -10px 0 30px rgba(0,0,0,0.3);
      color: #e6edf3;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      border-left: 2px solid #d4af37;
    }
    #inspector.active { right: 0; }
    .close-btn { align-self: flex-end; cursor: pointer; font-size: 20px; color: #8b949e; }
    .close-btn:hover { color: #fff; }
    .target-info { font-size: 24px; color: #d4af37; margin-top: 10px; margin-bottom: 5px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }
    .layer-name { font-size: 14px; color: #8b949e; margin-bottom: 25px; }

    /* 色彩タグ */
    .section-title { font-size: 14px; color: #d4af37; margin-bottom: 10px; }
    .color-picker { display: flex; gap: 8px; margin-bottom: 25px; }
    .color-tag { flex: 1; height: 40px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid transparent; transition: transform 0.2s; }
    .color-tag.selected { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .tag-rain { background: rgba(56, 189, 248, 0.3); color: #7dd3fc; }
    .tag-fruit { background: rgba(245, 158, 11, 0.3); color: #fcd34d; }
    .tag-wind { background: rgba(192, 132, 252, 0.3); color: #e9d5ff; }
    
    /* 入力フォーム */
    textarea { width: 100%; height: 100px; background: rgba(0, 0, 0, 0.4); border: 1px solid #30363d; color: #fff; padding: 10px; box-sizing: border-box; border-radius: 6px; font-family: inherit; resize: none; margin-bottom: 20px; }
    textarea:focus { outline: none; border-color: #d4af37; }
    .save-btn { background: linear-gradient(135deg, #d4af37, #b89320); color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .save-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <!-- SVGが読み込まれる空の枠 -->
  <div class="calendar-container" id="container"></div>

  <!-- 入力パネル -->
  <div id="inspector">
    <div class="close-btn" id="closeBtn">✕</div>
    <div class="target-info" id="dayDisplay">第 -- 日目</div>
    <div class="layer-name" id="layerDisplay">レイヤー: --</div>
    <div class="section-title">色彩・気配の記憶</div>
    <div class="color-picker">
      <div class="color-tag tag-rain selected" data-color="#38bdf8">雨・湿気</div>
      <div class="color-tag tag-fruit" data-color="#f59e0b">実り</div>
      <div class="color-tag tag-wind" data-color="#c084fc">風・気配</div>
    </div>
    <div class="section-title">言葉の刻印</div>
    <textarea id="haikuInput" placeholder="ここに俳句やメモを刻みます..."></textarea>
    <button class="save-btn" id="saveBtn">この記憶を定着させる</button>
  </div>

  <script>
    const container = document.getElementById('container');
    const inspector = document.getElementById('inspector');
    
    // システム変数
    let svg, dataLayer;
    let viewBox = { x: 0, y: 0, w: 1841.3719, h: 2382.9518 };
    const cx = 920.6859;
    const cy = 1191.4759;
    let currentCell = null;
    let activeColor = "#38bdf8";
    let calendarData = JSON.parse(localStorage.getItem('polarCalendarData')) || {};

    // 1. 外部SVG(calendar.svg)を読み込む魔法
    fetch('calendar.svg')
      .then(response => response.text())
      .then(svgCode => {
        // コンテナにSVGを流し込む
        container.innerHTML = svgCode;
        svg = container.querySelector('svg');
        
        // 自動処理1: viewBoxの初期化
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        
        // 自動処理2: 背景の白塗りをすべて透明(none)にする
        svg.querySelectorAll('*[fill="#fff"]').forEach(el => {
          el.setAttribute('fill', 'none');
        });

        // 自動処理3: 色塗り用の透明レイヤー(data-layer)を中心の円の下に挿入する
        dataLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        dataLayer.setAttribute("id", "data-layer");
        svg.insertBefore(dataLayer, svg.firstChild);

        // データの描画と操作イベントの開始
        renderSavedData();
        initInteractions();
      })
      .catch(err => console.error("SVGの読み込みに失敗しました:", err));

    // --- 色の描画処理 ---
    function renderSavedData() {
      dataLayer.innerHTML = "";
      for (const key in calendarData) {
        const data = calendarData[key];
        drawCell(data.rIn, data.rOut, data.startAngle, data.endAngle, data.color);
      }
    }

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
    }

    function drawCell(rIn, rOut, startAngle, endAngle, color) {
      const startIn = polarToCartesian(cx, cy, rIn, endAngle);
      const endIn = polarToCartesian(cx, cy, rIn, startAngle);
      const startOut = polarToCartesian(cx, cy, rOut, endAngle);
      const endOut = polarToCartesian(cx, cy, rOut, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      
      const d = [
        "M", startOut.x, startOut.y,
        "A", rOut, rOut, 0, largeArcFlag, 0, endOut.x, endOut.y,
        "L", endIn.x, endIn.y,
        "A", rIn, rIn, 0, largeArcFlag, 1, startIn.x, startIn.y,
        "Z"
      ].join(" ");
      
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", color);
      path.setAttribute("opacity", "0.4");
      dataLayer.appendChild(path);
    }

    // --- インタラクション（ズーム・移動・クリック）の初期化 ---
    function initInteractions() {
      // ホイール（トラックパッド）でズーム
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY > 0 ? 1.05 : 0.95;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        
        viewBox.w *= zoomFactor;
        viewBox.h *= zoomFactor;
        viewBox.x = svgP.x - (svgP.x - viewBox.x) * zoomFactor;
        viewBox.y = svgP.y - (svgP.y - viewBox.y) * zoomFactor;
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      }, { passive: false });

      // ドラッグで移動
      let isPanning = false, startPos = { x: 0, y: 0 }, dragDistance = 0;
      container.addEventListener('mousedown', (e) => {
        isPanning = true; dragDistance = 0;
        startPos = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        const dxScreen = startPos.x - e.clientX, dyScreen = startPos.y - e.clientY;
        dragDistance += Math.abs(dxScreen) + Math.abs(dyScreen);
        
        viewBox.x += dxScreen * (viewBox.w / container.clientWidth);
        viewBox.y += dyScreen * (viewBox.h / container.clientHeight);
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        startPos = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('mouseup', () => isPanning = false);

      // マス目のクリック判定
      svg.addEventListener('click', (e) => {
        if (dragDistance > 10) return; // ドラッグ時は無視

        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

        const dx = svgP.x - cx, dy = svgP.y - cy;
        const distance = Math.sqrt(dx * dx + dy * dy);
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
        angle = (angle + 90 + 360) % 360;

        const day = Math.floor(angle / 12) + 1;
        const startAngle = (day - 1) * 12;
        const endAngle = day * 12;

        let layerName = "", rIn = 0, rOut = 0;
        // SVGの半径に合わせた判定
        if (distance > 141 && distance <= 212) { layerName = "魚・海 (underwater)"; rIn = 141.7; rOut = 212.5; }
        else if (distance > 226 && distance <= 297) { layerName = "植物 (plants)"; rIn = 226.7; rOut = 297.6; }
        else if (distance > 297 && distance <= 340) { layerName = "メモ・コメント"; rIn = 297.6; rOut = 340.1; }
        else if (distance > 368 && distance <= 581) { layerName = "潮汐 (tide chart)"; rIn = 368.5; rOut = 581.1; }
        else return;

        currentCell = { day, layerId: layerName, rIn, rOut, startAngle, endAngle };
        
        document.getElementById('dayDisplay').innerText = `第 ${day} 日目`;
        document.getElementById('layerDisplay').innerText = `レイヤー: ${layerName}`;
        
        const cellKey = `${day}_${layerName}`;
        document.getElementById('haikuInput').value = calendarData[cellKey] ? calendarData[cellKey].text : "";
        inspector.classList.add('active');
      });
    }

    // パネル操作
    document.getElementById('closeBtn').addEventListener('click', () => inspector.classList.remove('active'));
    document.querySelectorAll('.color-tag').forEach(tag => {
      tag.addEventListener('click', (e) => {
        document.querySelectorAll('.color-tag').forEach(t => t.classList.remove('selected'));
        e.target.classList.add('selected');
        activeColor = e.target.getAttribute('data-color');
      });
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const cellKey = `${currentCell.day}_${currentCell.layerId}`;
      calendarData[cellKey] = {
        color: activeColor, text: document.getElementById('haikuInput').value,
        rIn: currentCell.rIn, rOut: currentCell.rOut, 
        startAngle: currentCell.startAngle, endAngle: currentCell.endAngle
      };
      localStorage.setItem('polarCalendarData', JSON.stringify(calendarData));
      renderSavedData();
      inspector.classList.remove('active');
    });
  </script>
</body>
</html>
