<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polar Calendar - ペイントモード版</title>
  <style>
    body {
      background-color: #f5f3eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: "Shippori Mincho", serif, sans-serif;
      overflow: hidden;
    }

    /* カレンダー枠 */
    .calendar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      cursor: grab;
    }
    .calendar-container:active { cursor: grabbing; }
    
    .calendar-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ツールパレット（常に画面左上に浮いているお絵描きツール） */
    #palette {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(25, 30, 40, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #e6edf3;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .palette-title {
      font-size: 14px;
      color: #d4af37;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 5px;
      margin-bottom: 5px;
    }

    .color-tag {
      width: 120px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .color-tag:hover { transform: translateX(5px); }
    .color-tag.selected { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); transform: translateX(10px); }
    
    .tag-rain { background: rgba(56, 189, 248, 0.5); color: #e0f2fe; }
    .tag-fruit { background: rgba(245, 158, 11, 0.5); color: #fef3c7; }
    .tag-wind { background: rgba(192, 132, 252, 0.5); color: #f3e8ff; }
    .tag-eraser { background: rgba(255, 255, 255, 0.1); color: #8b949e; border: 1px dashed #8b949e; }

    /* 画面下部のステータス表示（現在カーソルがある場所の情報） */
    #status-bar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 30, 40, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 25px;
      border-radius: 30px;
      color: #d4af37;
      font-size: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 100;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- カレンダー本体 -->
  <div class="calendar-container" id="container"></div>

  <!-- 絵の具パレット -->
  <div id="palette">
    <div class="palette-title">気配の筆（ペイント）</div>
    <div class="color-tag tag-rain selected" data-color="#38bdf8">雨・湿気</div>
    <div class="color-tag tag-fruit" data-color="#f59e0b">実り</div>
    <div class="color-tag tag-wind" data-color="#c084fc">風・気配</div>
    <div class="color-tag tag-eraser" data-color="erase">消しゴム</div>
  </div>

  <!-- ステータスバー -->
  <div id="status-bar">空間を認識中...</div>

  <script>
    const container = document.getElementById('container');
    const statusBar = document.getElementById('status-bar');
    
    let svg, dataLayer;
    let viewBox = { x: 0, y: 0, w: 1841.3719, h: 2382.9518 };
    const cx = 920.6859;
    const cy = 1191.4759;
    
    // 現在選択中の筆の色（デフォルトは雨）
    let activeBrush = "#38bdf8"; 
    
    // 記憶データ
    let calendarData = JSON.parse(localStorage.getItem('polarCalendarDataV2')) || {};

    // 1. SVGの読み込み
    fetch('calendar.svg')
      .then(response => response.text())
      .then(svgCode => {
        container.innerHTML = svgCode;
        svg = container.querySelector('svg');
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        
        svg.querySelectorAll('*[fill="#fff"]').forEach(el => el.setAttribute('fill', 'none'));

        dataLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        dataLayer.setAttribute("id", "data-layer");
        svg.insertBefore(dataLayer, svg.firstChild);

        renderSavedData();
        initInteractions();
      })
      .catch(err => console.error("SVG読み込みエラー:", err));

    // --- 色の描画 ---
    function renderSavedData() {
      dataLayer.innerHTML = "";
      for (const key in calendarData) {
        const data = calendarData[key];
        drawCell(data.rIn, data.rOut, data.startAngle, data.endAngle, data.color);
      }
    }

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
    }

    function drawCell(rIn, rOut, startAngle, endAngle, color) {
      const startIn = polarToCartesian(cx, cy, rIn, endAngle);
      const endIn = polarToCartesian(cx, cy, rIn, startAngle);
      const startOut = polarToCartesian(cx, cy, rOut, endAngle);
      const endOut = polarToCartesian(cx, cy, rOut, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      
      const d = [
        "M", startOut.x, startOut.y,
        "A", rOut, rOut, 0, largeArcFlag, 0, endOut.x, endOut.y,
        "L", endIn.x, endIn.y,
        "A", rIn, rIn, 0, largeArcFlag, 1, startIn.x, startIn.y,
        "Z"
      ].join(" ");
      
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", color);
      path.setAttribute("opacity", "0.6"); // 色を少し濃くしました
      dataLayer.appendChild(path);
    }

    // --- パレットの選択機能 ---
    document.querySelectorAll('.color-tag').forEach(tag => {
      tag.addEventListener('click', (e) => {
        document.querySelectorAll('.color-tag').forEach(t => t.classList.remove('selected'));
        e.target.classList.add('selected');
        activeBrush = e.target.getAttribute('data-color');
      });
    });

    // --- ズーム・移動・ペイント機能 ---
    function initInteractions() {
      // ズーム
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY > 0 ? 1.05 : 0.95;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        
        viewBox.w *= zoomFactor; viewBox.h *= zoomFactor;
        viewBox.x = svgP.x - (svgP.x - viewBox.x) * zoomFactor;
        viewBox.y = svgP.y - (svgP.y - viewBox.y) * zoomFactor;
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      }, { passive: false });

      // ドラッグ移動
      let isPanning = false, startPos = { x: 0, y: 0 }, dragDistance = 0;
      container.addEventListener('mousedown', (e) => {
        isPanning = true; dragDistance = 0;
        startPos = { x: e.clientX, y: e.clientY };
      });
      
      window.addEventListener('mousemove', (e) => {
        // ドラッグ中の画面移動
        if (isPanning) {
          const dxScreen = startPos.x - e.clientX, dyScreen = startPos.y - e.clientY;
          dragDistance += Math.abs(dxScreen) + Math.abs(dyScreen);
          viewBox.x += dxScreen * (viewBox.w / container.clientWidth);
          viewBox.y += dyScreen * (viewBox.h / container.clientHeight);
          svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
          startPos = { x: e.clientX, y: e.clientY };
        }

        // マウスホバー中の座標計算（画面下部のステータス表示用）
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        const dx = svgP.x - cx, dy = svgP.y - cy;
        const distance = Math.sqrt(dx * dx + dy * dy);
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
        angle = (angle + 90 + 360) % 360;

        // 3度ごとに分割 (0〜119の区画)
        const segmentIndex = Math.floor(angle / 3);
        const day = Math.floor(segmentIndex / 4) + 1;
        const timeSlot = segmentIndex % 4;
        
        const timeLabels = ["0:00〜6:00", "6:00〜12:00", "12:00〜18:00", "18:00〜24:00"];
        const timeLabel = timeLabels[timeSlot];

        let layerName = "";
        if (distance > 141 && distance <= 212) layerName = "海 (underwater)";
        else if (distance > 226 && distance <= 297) layerName = "植物 (plants)";
        else if (distance > 297 && distance <= 340) layerName = "メモ・コメント";
        else if (distance > 368 && distance <= 581) layerName = "潮汐 (tide)";
        
        if (layerName) {
          statusBar.innerText = `第 ${day} 日目 ｜ ${timeLabel} ｜ ${layerName}`;
          statusBar.style.color = "#fff";
        } else {
          statusBar.innerText = `キャンバス外`;
          statusBar.style.color = "#8b949e";
        }
      });
      window.addEventListener('mouseup', () => isPanning = false);

      // ★ペイント処理（クリックで即座に塗る）
      svg.addEventListener('click', (e) => {
        if (dragDistance > 5) return; // ドラッグした場合は塗らない

        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

        const dx = svgP.x - cx, dy = svgP.y - cy;
        const distance = Math.sqrt(dx * dx + dy * dy);
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
        angle = (angle + 90 + 360) % 360;

        // 3度ごとのマス目計算
        const segmentIndex = Math.floor(angle / 3);
        const startAngle = segmentIndex * 3;
        const endAngle = (segmentIndex + 1) * 3;

        let layerName = "", rIn = 0, rOut = 0;
        if (distance > 141 && distance <= 212) { layerName = "underwater"; rIn = 141.7; rOut = 212.5; }
        else if (distance > 226 && distance <= 297) { layerName = "plants"; rIn = 226.7; rOut = 297.6; }
        else if (distance > 297 && distance <= 340) { layerName = "comment"; rIn = 297.6; rOut = 340.1; }
        else if (distance > 368 && distance <= 581) { layerName = "tide"; rIn = 368.5; rOut = 581.1; }
        else return;

        // 保存用のユニークキー（例：day8_slot2_plants）
        const day = Math.floor(segmentIndex / 4) + 1;
        const timeSlot = segmentIndex % 4;
        const cellKey = `day${day}_slot${timeSlot}_${layerName}`;

        if (activeBrush === "erase") {
          // 消しゴムの場合：データを削除
          delete calendarData[cellKey];
        } else {
          // 色塗り（ペイント）の場合：データを保存
          calendarData[cellKey] = {
            color: activeBrush,
            rIn: rIn, rOut: rOut, 
            startAngle: startAngle, endAngle: endAngle
          };
        }
        
        // 記憶をローカルに保存して、再描画
        localStorage.setItem('polarCalendarDataV2', JSON.stringify(calendarData));
        renderSavedData();
      });
    }
  </script>
</body>
</html>
